<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leycon Autos Admin</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f3f8;margin:0;color:#1b2236}
header{background:#0d1b3d;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}header img{height:36px;border-radius:5px;vertical-align:middle;margin-right:8px}
.w{max-width:1000px;margin:20px auto;padding:0 16px}.c{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 10px #0001}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccd;border-radius:8px;margin:4px 0 10px;font:inherit}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}button{background:#e63946;color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600}
button.s{background:#0d1b3d;padding:6px 12px;font-size:13px;margin-right:4px}button.d{background:#999;padding:6px 12px;font-size:13px}
.r{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.r img{width:70px;height:50px;object-fit:cover;border-radius:6px;background:#0d1b3d}.r div{flex:1}
#app{display:none}#lg{max-width:340px;margin:100px auto}</style></head><body>
<div id="lg" class="c"><h3>Admin Login</h3><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button> <p id="err" style="color:red"></p></div>
<div id="app"><header><div><img src="logo.png">Leycon Autos Admin</div><button class="s" onclick="location.reload()">Logout</button></header>
<div class="w"><div class="c"><h3>Add a Car</h3><form id="cf"><div class="g">
<div>Make<input name="make" placeholder="Mercedes-Benz" required></div><div>Model<input name="model" placeholder="GLE350" required></div>
<div>Price (₦)<input name="price" type="number" required></div><div>Year<input name="year" type="number"></div>
<div>Type<select name="type"><option>Tokunbo</option><option>Brand New</option><option>Nigerian Used</option></select></div><div>Body<input name="body" placeholder="SUV"></div></div>
Description<textarea name="description" rows="2"></textarea>Photos (up to 10)<input name="images" type="file" accept="image/*" multiple>
<label><input type="checkbox" name="featured" value="true" style="width:auto"> Featured</label><br><br><button>Add Car</button></form></div>
<div class="c"><h3>Cars</h3><div id="cl"></div></div><div class="c"><h3>Enquiries</h3><div id="el"></div></div></div></div>
<script>
let T='';const $=s=>document.querySelector(s),H=()=>({'x-token':T,'Content-Type':'application/json'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
 if(!r.ok)return $('#err').textContent='Wrong password';T=(await r.json()).token;$('#lg').style.display='none';$('#app').style.display='block';load()}
async function load(){
 const cars=await (await fetch('/api/cars')).json();
 $('#cl').innerHTML=cars.map(c=>`<div class="r"><img src="${esc(c.images[0]||'logo.png')}"><div><b>${esc(c.make)} ${esc(c.model)}</b><br>₦${Number(c.price).toLocaleString()} · ${c.status}${c.featured?' · ★':''}</div>
 <button class="s" onclick="up('${c.id}',{status:'${c.status==='Sold'?'Available':'Sold'}'})">Mark ${c.status==='Sold'?'Available':'Sold'}</button><button class="s" onclick="up('${c.id}',{featured:${!c.featured}})">★</button><button class="d" onclick="del('/api/cars/${c.id}')">Delete</button></div>`).join('')||'No cars yet.';
 const en=await (await fetch('/api/enquiries',{headers:H()})).json();
 $('#el').innerHTML=en.map(e=>`<div class="r"><div><b>${esc(e.name)}</b> · <a href="tel:${esc(e.phone)}">${esc(e.phone)}</a><br>${esc(e.interest)} ${esc(e.budget)}<br><small>${esc(e.message)} — ${new Date(e.date).toLocaleString()}</small></div><button class="d" onclick="del('/api/enquiries/${e.id}')">Delete</button></div>`).join('')||'No enquiries yet.'}
const up=async(id,b)=>{await fetch('/api/cars/'+id,{method:'PUT',headers:H(),body:JSON.stringify(b)});load()};
const del=async u=>{if(confirm('Delete?')){await fetch(u,{method:'DELETE',headers:H()});load()}};
$('#cf').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/cars',{method:'POST',headers:{'x-token':T},body:new FormData(e.target)});if(r.ok){e.target.reset();load()}else alert('Failed to add car')};
</script></body></html>
